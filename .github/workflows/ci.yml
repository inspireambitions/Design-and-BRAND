name: CI

on:
  pull_request:
  push:
    branches:
      - claude/gulf-hospitality-video-interview-m9skfu

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: muqabala
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: muqabala/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: node --experimental-strip-types --test scripts/*.test.mjs

      # No secrets are provided here on purpose: the production build must
      # succeed without them, so a missing variable cannot break a deploy.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Bundle budget
        run: npm run check:bundle
